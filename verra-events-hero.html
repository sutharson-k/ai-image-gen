<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verra — Events. Circles. Creators.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root { --u: 1px; }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Inter, "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-optical-sizing: auto;
  }

  /* ---------------------------------------------------- the frame --- */
  .frame {
    position: fixed;
    inset: 7.2vh 5vw;
    border-radius: calc(14 * var(--u));
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: #000;
    overflow: hidden;
    --u: 1px;
  }

  canvas.ring-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* --------------------------------------------------------- nav --- */
  .nav {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: space-between;
    top: calc(24 * var(--u));
    left: calc(26 * var(--u));
    right: calc(24 * var(--u));
    z-index: 4;
  }
  .nav .brand {
    display: flex;
    align-items: center;
    gap: calc(8 * var(--u));
    color: #fff;
  }
  .nav .brand svg { display: block; }
  .nav .brand .name {
    font-size: calc(17.5 * var(--u));
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .nav .right {
    display: flex;
    align-items: center;
    gap: calc(4 * var(--u));
  }
  .nav .pill {
    display: flex;
    align-items: center;
    gap: calc(18 * var(--u));
    height: calc(29 * var(--u));
    padding: 0 calc(20 * var(--u));
    border-radius: calc(8 * var(--u));
    background: rgba(150, 150, 150, 0.38);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    font-size: calc(14 * var(--u));
    color: rgba(255, 255, 255, 0.94);
  }
  .nav .pill a {
    color: inherit;
    text-decoration: none;
    opacity: 0.86;
  }
  .nav .pill a:hover { opacity: 1; }
  .nav .btn-connect {
    height: calc(29 * var(--u));
    padding: 0 calc(16 * var(--u));
    border: 0;
    border-radius: calc(8 * var(--u));
    background: #fff;
    color: #131313;
    font-family: inherit;
    font-size: calc(14 * var(--u));
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .nav .btn-connect:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(255, 255, 255, 0.18);
  }

  /* ------------------------------------------------- headline group --- */
  .headline-group {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(400 * var(--u)); /* word cap top lands ≈ 447u */
    text-align: center;
    z-index: 3;
    pointer-events: none;
  }
  .headline-group > * { pointer-events: auto; }

  .headword-wrap {
    display: inline-flex;
    align-items: flex-end;
    justify-content: center;
    vertical-align: top;
  }
  .headword {
    font-size: calc(176 * var(--u));
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(12deg, #fffaf6 28%, #ffe6d6 46%, #ffbc98 66%, #ff8f62 88%, #ff7a4c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: pre;
  }
  .caret {
    width: calc(1.6 * var(--u));
    height: calc(124 * var(--u));
    margin-left: calc(7 * var(--u));
    margin-bottom: calc(8 * var(--u));
    background: #ffb48c;
    border-radius: calc(0.8 * var(--u));
  }
  .caret.blink { animation: caretBlink 1.1s steps(1) infinite; }
  @keyframes caretBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
  }

  .subline {
    margin-top: calc(26 * var(--u));
    font-size: calc(18 * var(--u));
    line-height: calc(24 * var(--u));
    color: rgba(255, 255, 255, 0.92);
  }

  .btn-cta {
    margin-top: calc(19 * var(--u));
    height: calc(41 * var(--u));
    padding: 0 calc(17 * var(--u));
    border: 0;
    border-radius: calc(10 * var(--u));
    background: #fff;
    color: #17130f;
    font-family: inherit;
    font-size: calc(15 * var(--u));
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 34px rgba(255, 132, 64, 0.36);
  }

  /* ------------------------------------------------------- phones --- */
  @media (max-width: 767px) {
    .frame { inset: 10px; }
    .nav .pill { display: none; }
    .headword {
      font-size: min(calc(176 * var(--u)), 22vw);
    }
    .subline {
      font-size: 15px;
      line-height: 21px;
    }
    .headline-group {
      top: auto;
      bottom: 6vh;
      transform: none;
    }
  }
</style>
</head>
<body>

<div class="frame" id="frame">
  <canvas class="ring-canvas" id="ringCanvas"></canvas>

  <nav class="nav">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <!-- outlined diamond over an open V -->
        <path d="M12 2.2 16.4 6.6 12 11 7.6 6.6Z" stroke="rgba(255,255,255,.95)" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M4.5 13.5 12 21.5 19.5 13.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="name">Verra</span>
    </div>
    <div class="right">
      <div class="pill">
        <a href="#">Explore</a>
        <a href="#">Circles</a>
        <a href="#">People</a>
      </div>
      <button class="btn-connect" type="button">Connect</button>
    </div>
  </nav>

  <div class="headline-group">
    <div class="headword-wrap">
      <span class="headword" id="headword">Events</span>
      <span class="caret" id="caret"></span>
    </div>
    <p class="subline">
      Verra provides a space for creators to build<br>
      communities from zero to millions.
    </p>
    <div>
      <button class="btn-cta" type="button">Get started now</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // Layer gates for visual debugging: ?layer=ambient|bodies|edges|halos|bloom|all
  // Default 'all' renders everything; a single name renders only that pass
  // so each layer can be inspected in isolation.
  const layer = new URLSearchParams(location.search).get('layer') || 'all';
  const show = (name) => layer === 'all' || layer === name;

  const frame = document.getElementById('frame');
  const canvas = document.getElementById('ringCanvas');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ------------------------------------------------------------------
     Clock. Plain mode reads performance.now(). With ?rec=1 in the URL,
     time comes from a paused Web Animation on a hidden 1px element
     (a 100 s linear translateX), which a frame-by-frame recorder can
     seek to get exact matching frames.
  ------------------------------------------------------------------ */
  let clock = () => performance.now() / 1000;
  if (new URLSearchParams(location.search).has('rec')) {
    const probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;';
    document.body.appendChild(probe);
    const anim = probe.animate(
      [{ transform: 'translateX(0px)' }, { transform: 'translateX(100000px)' }],
      { duration: 100000, easing: 'linear' }
    );
    anim.pause();
    clock = () => (anim.currentTime || 0) / 1000;
  }

  /* ---------------------------------------------------- typography --- */
  const WORDS = ['Events', 'Circles', 'Creators'];
  const HOLD_S = 2.6, DELETE_MS = 70, EMPTY_PAUSE_S = 0.25, TYPE_MS = 100, NEXT_PAUSE_S = 0.15;
  const wordPhase = (wordLen, i) =>
    HOLD_S + (wordLen * DELETE_MS) / 1000 + EMPTY_PAUSE_S +
    (wordLen * TYPE_MS) / 1000 + NEXT_PAUSE_S;

  function typewriterAt(t) {
    // Pure function of time: which slice of the loop, and what text.
    let acc = 0;
    for (let i = 0; i < WORDS.length; i++) {
      const w = WORDS[i];
      const inWord = wordPhase(w.length, i);
      const phaseStart = acc;

      if (t < acc + HOLD_S) {
        return { text: w, blinking: true };
      }
      acc += HOLD_S;

      const deletions = Math.min(w.length, Math.floor(((t - acc) * 1000) / DELETE_MS));
      if (t < acc + (w.length * DELETE_MS) / 1000) {
        return { text: w.slice(0, w.length - deletions), blinking: false };
      }
      acc += (w.length * DELETE_MS) / 1000;

      if (t < acc + EMPTY_PAUSE_S) {
        return { text: '', blinking: false };
      }
      acc += EMPTY_PAUSE_S;

      const nxt = WORDS[(i + 1) % WORDS.length];
      const typed = Math.min(nxt.length, Math.floor(((t - acc) * 1000) / TYPE_MS));
      if (t < acc + (nxt.length * TYPE_MS) / 1000) {
        return { text: nxt.slice(0, typed), blinking: false };
      }
      acc += (nxt.length * TYPE_MS) / 1000;

      if (t < acc + NEXT_PAUSE_S) {
        return { text: nxt, blinking: false };
      }
      acc += NEXT_PAUSE_S;
      void phaseStart; void inWord;
    }
    // loop total t is kept large by callers; fall back
    return { text: WORDS[0], blinking: true };
  }

  const headwordEl = document.getElementById('headword');
  const caretEl = document.getElementById('caret');
  let shownText = null;
  let shownBlink = null;
  function updateTypewriter(t) {
    const { text, blinking } = typewriterAt(t);
    if (text !== shownText) {
      shownText = text;
      headwordEl.textContent = text;
    }
    if (blinking !== shownBlink) {
      shownBlink = blinking;
      caretEl.classList.toggle('blink', blinking);
    }
  }

  /* ------------------------------------------------------- pointer --- */
  const pointer = { tx: 0, ty: 0, x: 0, y: 0, vs: 0 }; // target + eased values
  window.addEventListener('pointermove', (e) => {
    const r = frame.getBoundingClientRect();
    const nx = ((e.clientX - (r.left + r.width / 2)) / (r.width / 2));
    const ny = ((e.clientY - (r.top + r.height / 2)) / (r.height / 2));
    pointer.tx = Math.max(-1, Math.min(1, nx));
    pointer.ty = Math.max(-1, Math.min(1, ny));
  }, { passive: true });

  /* -------------------------------------------------- ring geometry --- */
  const STRANDS = 196;
  const SAMPLES = 41;      // points from inner rim to outer rim
  const RI_U = 435, RO_U = 652;
  // Strand draw order: angular, starting at the top of the ring (off-screen).
  const drawOrder = [];
  for (let i = 0; i < STRANDS; i++) drawOrder.push(i);

  let W = 0, H = 0, dpr = 1, uPx = 1, K = 1; // K: device px per u
  let frameLeft = 0, frameTop = 0;

  function resize() {
    const rect = frame.getBoundingClientRect();
    const phone = window.innerWidth < 768;
    const u = phone ? rect.width / 600 : Math.min(rect.width / 1052, rect.height / 754);
    frame.style.setProperty('--u', u + 'px');
    uPx = u;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = rect.width; H = rect.height;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    K = uPx * dpr;
  }
  resize();
  window.addEventListener('resize', () => { resize(); if (reducedMotion) drawFrame(clock()); });

  const smoothstep = (x) => { const t = Math.max(0, Math.min(1, x)); return t * t * (3 - 2 * t); };

  // Half-width of a ribbon at radial parameter q (0 at inner rim .. 1 at outer rim)
  const halfWidthU = (q) => (0.15 + 3.3 * smoothstep(q / 0.28) * (1 - 0.25 * q));

  function buildFrame(t) {
    // Returns per-strand sample arrays in *u-space* (centre + halfwidth).
    const spin = 0.06 * t;
    const kCurl = 0.42 * (1 + 0.12 * Math.sin(0.55 * t));
    const str = [];
    for (let i = 0; i < STRANDS; i++) {
      const a0 = (2 * Math.PI * i) / STRANDS + spin;
      const wob = Math.sin(3 * a0 + 0.4 * t);
      const pts = new Float64Array(SAMPLES * 2);
      for (let j = 0; j < SAMPLES; j++) {
        const q = j / (SAMPLES - 1);
        const theta = a0 + kCurl * Math.pow(1 - q, 4.2) + 0.05 * kCurl * q * q +
                      0.02 * Math.sin(Math.PI * q) * wob;
        const r = RI_U + (RO_U - RI_U) * q;
        pts[j * 2] = r * Math.cos(theta);
        pts[j * 2 + 1] = r * Math.sin(theta); // vertical scale applied at draw time
      }
      str.push(pts);
    }
    // order strands by screen angle starting at top (theta = -PI/2)
    const a0 = (i) => (2 * Math.PI * i) / STRANDS + spin;
    drawOrder.sort((ia, ib) => {
      const ka = (a0(ia) + Math.PI / 2) % (2 * Math.PI);
      const kb = (a0(ib) + Math.PI / 2) % (2 * Math.PI);
      return ka - kb;
    });
    return { t, spin, kCurl, str };
  }

  function ribbonPolys(pts, cx, cy, vscale) {
    // Build the two offset outlines of the ribbon in *device px*.
    const left = new Float64Array(SAMPLES * 2);
    const right = new Float64Array(SAMPLES * 2);
    const X = (i) => cx + pts[i * 2] * K;
    const Y = (i) => cy + pts[i * 2 + 1] * K * vscale;
    for (let j = 0; j < SAMPLES; j++) {
      const i0 = Math.max(0, j - 1), i1 = Math.min(SAMPLES - 1, j + 1);
      let tx = X(i1) - X(i0), ty = Y(i1) - Y(i0);
      const len = Math.hypot(tx, ty) || 1;
      tx /= len; ty /= len;
      const nx = -ty, ny = tx; // normal
      const q = j / (SAMPLES - 1);
      const hw = halfWidthU(q) * K;
      left[j * 2] = X(j) + nx * hw; left[j * 2 + 1] = Y(j) + ny * hw;
      right[j * 2] = X(j) - nx * hw; right[j * 2 + 1] = Y(j) - ny * hw;
    }
    return { left, right };
  }

  function traceRibbon(c, poly) {
    const { left, right } = poly;
    c.moveTo(left[0], left[1]);
    for (let j = 1; j < SAMPLES; j++) c.lineTo(left[j * 2], left[j * 2 + 1]);
    for (let j = SAMPLES - 1; j >= 0; j--) c.lineTo(right[j * 2], right[j * 2 + 1]);
    c.closePath();
  }

  function tracePolyline(c, poly) {
    c.moveTo(poly[0], poly[1]);
    for (let j = 1; j < SAMPLES; j++) c.lineTo(poly[j * 2], poly[j * 2 + 1]);
  }

  // Colours (radial: value follows radius, stops read from inner rim out)
  function bodyGradient(c, cx, cy) {
    const g = c.createRadialGradient(cx, cy, RI_U * K, cx, cy, RO_U * K);
    g.addColorStop(0.00, '#b01e50');
    g.addColorStop(0.12, '#9c1236');
    g.addColorStop(0.40, '#860c18');
    g.addColorStop(0.70, '#9c1a0a');
    g.addColorStop(0.90, '#c63c0e');
    g.addColorStop(1.00, '#e85a18');
    return g;
  }
  function edgeGradient(c, cx, cy) {
    const g = c.createRadialGradient(cx, cy, RI_U * K, cx, cy, RO_U * K);
    g.addColorStop(0.00, 'rgba(255,130,185,.85)');
    g.addColorStop(0.08, 'rgba(255,84,138,.95)');
    g.addColorStop(0.28, 'rgba(255,56,80,.95)');
    g.addColorStop(0.55, 'rgba(255,58,44,.95)');
    g.addColorStop(0.80, 'rgba(255,92,36,.98)');
    g.addColorStop(0.94, 'rgba(255,122,44,1)');
    g.addColorStop(1.00, 'rgba(255,150,70,1)');
    return g;
  }

  function drawAmbient(c, cx, cy) {
    // deep red ambient fill in the annulus, drawn beneath the ribbons
    const ann = c.createRadialGradient(cx, cy, RI_U * K * 0.92, cx, cy, RO_U * K * 1.02);
    ann.addColorStop(0.0, 'rgba(170,14,50,.35)');
    ann.addColorStop(0.45, 'rgba(120,8,14,.45)');
    ann.addColorStop(1.0, 'rgba(170,40,6,.40)');
    c.save();
    c.beginPath();
    c.arc(cx, cy, RO_U * K * 1.02, 0, Math.PI * 2);
    c.arc(cx, cy, RI_U * K * 0.92, 0, Math.PI * 2, true);
    c.fillStyle = ann;
    c.fill();
    c.restore();
  }

  function drawHalos(c, cx, cy, vscale) {
    c.save();
    c.globalCompositeOperation = 'lighter';

    // orange halo band (ro - 16u .. ro + 70u), peak 0.42
    const hs = (RO_U - 16) * K, he = (RO_U + 70) * K;
    const halo = c.createRadialGradient(cx, cy, hs, cx, cy, he);
    halo.addColorStop(0.00, 'rgba(255,120,40,0.20)');
    halo.addColorStop(0.32, 'rgba(255,110,36,0.42)');
    halo.addColorStop(1.00, 'rgba(255,140,60,0.00)');
    c.beginPath();
    c.arc(cx, cy, he, 0, Math.PI * 2);
    c.arc(cx, cy, hs, 0, Math.PI * 2, true);
    c.fillStyle = halo;
    c.fill();

    // faint pink inner halo (0.09)
    const is_ = (RI_U - 60) * K, ie = (RI_U + 26) * K;
    const ihalo = c.createRadialGradient(cx, cy, is_, cx, cy, ie);
    ihalo.addColorStop(0.0, 'rgba(255,140,190,0.00)');
    ihalo.addColorStop(0.55, 'rgba(255,140,190,0.09)');
    ihalo.addColorStop(1.0, 'rgba(255,140,190,0.00)');
    c.beginPath();
    c.arc(cx, cy, ie, 0, Math.PI * 2);
    c.arc(cx, cy, is_, 0, Math.PI * 2, true);
    c.fillStyle = ihalo;
    c.fill();
    c.restore();

    // thin orange outer-rim line (1.6u)
    c.beginPath();
    c.arc(cx, cy, RO_U * K * vscale, 0, Math.PI * 2);
    c.lineWidth = 1.6 * K;
    c.strokeStyle = 'rgba(255,138,64,0.9)';
    c.stroke();
  }

  let bloomCanvas = null;

  function drawBloom(c, polys, cx, cy, vscale) {
    if (!bloomCanvas) bloomCanvas = document.createElement('canvas');
    const S = 0.32;
    const bw = Math.max(1, Math.round(canvas.width * S));
    const bh = Math.max(1, Math.round(canvas.height * S));
    if (bloomCanvas.width !== bw || bloomCanvas.height !== bh) {
      bloomCanvas.width = bw; bloomCanvas.height = bh;
    }
    const b = bloomCanvas.getContext('2d');
    b.clearRect(0, 0, bw, bh);
    b.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    b.lineCap = 'round';
    b.lineJoin = 'round';

    // every edge again, 5.3u wide, alpha 0.7
    b.save();
    b.globalCompositeOperation = 'lighter';
    b.strokeStyle = edgeGradient(b, cx, cy);
    b.globalAlpha = 0.22;
    b.lineWidth = 5.3 * K;
    for (const poly of polys) {
      b.beginPath();
      tracePolyline(b, poly.right);
      b.stroke();
    }
    b.globalAlpha = 1.0;
    // 9u orange outer-rim ring
    b.beginPath();
    b.arc(cx, cy, RO_U * K * vscale, 0, Math.PI * 2);
    b.strokeStyle = 'rgba(255,150,80,0.32)';
    b.lineWidth = 9 * K;
    b.stroke();
    // 5u pink inner-rim ring
    b.beginPath();
    b.arc(cx, cy, RI_U * K * vscale, 0, Math.PI * 2);
    b.strokeStyle = 'rgba(255,140,190,0.28)';
    b.lineWidth = 5 * K;
    b.stroke();
    b.restore();

    // composite onto main canvas, lighter, 8u blur
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'lighter';
    c.filter = 'blur(' + (8 * K).toFixed(1) + 'px)';
    c.drawImage(bloomCanvas, 0, 0, canvas.width, canvas.height);
    c.restore();
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawFrame(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // pointer easing (lerp 0.05) — up to 14u x 10u, vscale ±3.5 %
    pointer.x += (pointer.tx - pointer.x) * 0.05;
    pointer.y += (pointer.ty - pointer.y) * 0.05;
    pointer.vs += (pointer.ty - pointer.vs) * 0.05;

    const frameW = W, frameH = H;
    const baseCx = frameW / 2 + 34 * uPx;
    const baseCy = -212 * uPx;
    const cx = baseCx + pointer.x * 14 * uPx;
    const cy = baseCy - pointer.y * 10 * uPx; // toward pointer
    const vscale = 1.03 + 0.035 * pointer.vs;

    const F = buildFrame(t);

    if (show('ambient')) drawAmbient(ctx, cx, cy);

    // Ribbons: in angular order, each body is opaque, then its leading
    // edge is stroked in lighter mode — the NEXT body covers most of that
    // edge, which is what gives the layered-fin depth without bloom-out.
    const polys = new Array(STRANDS);
    ctx.strokeStyle = edgeGradient(ctx, cx, cy);
    ctx.lineWidth = 1.45 * K;
    ctx.lineJoin = 'round';
    ctx.fillStyle = bodyGradient(ctx, cx, cy);
    for (const i of drawOrder) {
      const poly = ribbonPolys(F.str[i], cx, cy, vscale);
      polys[i] = poly;
      if (show('bodies')) {
        ctx.beginPath();
        traceRibbon(ctx, poly);
        ctx.fill();
      }
      if (show('edges')) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        tracePolyline(ctx, poly.right); // leading edge, offset by the half-width
        ctx.stroke();
        ctx.restore();
      }
    }

    if (show('halos')) drawHalos(ctx, cx, cy, vscale);
    if (show('bloom')) drawBloom(ctx, polys, cx, cy, vscale);
  }

  /* --------------------------------------------------- render loop --- */
  if (reducedMotion) {
    caretEl.classList.remove('blink');
    updateTypewriter(0);
    drawFrame(0);
  } else {
    const tick = () => {
      if (document.hidden) {
        // The loop pauses while the tab is hidden; rAF effectively stops here.
        requestAnimationFrame(tick);
        return;
      }
      const t = clock();
      updateTypewriter(t);
      drawFrame(t);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
